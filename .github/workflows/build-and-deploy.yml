name: Bygg og deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  buildDev:
    uses: navikt/aap-workflows/.github/workflows/frontend-next-build.yml@bb3280552f7e445fffa11e0cbf41087feac4047d # main
    permissions:
      contents: read
      id-token: write
      packages: write
    secrets: inherit
    with:
      cluster: dev-gcp
      appname: 'aap-saksbehandling'
      playwright: false
      cdn: true
  buildProd:
    uses: navikt/aap-workflows/.github/workflows/frontend-next-build.yml@bb3280552f7e445fffa11e0cbf41087feac4047d # main
    permissions:
      contents: read
      id-token: write
      packages: write
    if: github.ref == 'refs/heads/main'
    secrets: inherit
    with:
      cluster: prod-gcp
      appname: 'aap-saksbehandling'
      playwright: false
      cdn: true

  deployDev:
    needs: buildDev
    uses: navikt/aap-workflows/.github/workflows/deploy.yml@bb3280552f7e445fffa11e0cbf41087feac4047d # main
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      cluster: dev-gcp
      manifest: .nais/dev-gcp.yaml
      imageSuffix: -dev-gcp

  deployProd:
    needs: [buildProd, deployDev]
    uses: navikt/aap-workflows/.github/workflows/deploy.yml@bb3280552f7e445fffa11e0cbf41087feac4047d # main
    permissions:
      contents: read
      id-token: write
    if: github.ref == 'refs/heads/main'
    secrets: inherit
    with:
      cluster: prod-gcp
      manifest: .nais/prod-gcp.yaml
      imageSuffix: -prod-gcp
